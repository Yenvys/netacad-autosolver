<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetAcad Assistant</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <!-- Top Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="Logo" class="logo" />
        <div>
          <h1>NetAcad Assistant</h1>
          <p class="subtitle">v1.8 · Multi-Key &amp; Soft UI</p>
        </div>
      </div>
      <button id="solveNowBtn" class="scan-btn" title="Scan & Jawab Sekarang (Alt+S)">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>Scan</span>
      </button>
    </header>

    <!-- Primary Mode Cards (2-Column Icon Switch) -->
    <div class="mode-grid">
      <label class="mode-card" id="aiModeCard" title="AI otomatis membaca, memilih, dan submit soal">
        <input type="checkbox" id="enabled" />
        <div class="mode-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
        </div>
        <div class="mode-text">
          <span>AI Auto</span>
          <small>Jawab Otomatis</small>
        </div>
      </label>

      <label class="mode-card" id="manualModeCard" title="Tetap jalan walau kuota habis: pilih jawaban sendiri, otomatis klik Submit">
        <input type="checkbox" id="manualAutoSubmit" />
        <div class="mode-icon">
          <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <div class="mode-text">
          <span>Manual Submit</span>
          <small>Klik -> Auto Submit</small>
        </div>
      </label>
    </div>

    <!-- Quota Level Segmented Bar (Icon Pills) -->
    <section class="card">
      <div class="section-head">
        <span class="section-label">Level Kuota AI</span>
        <span id="quotaStats" class="stat-badge">API 0 · Cache 0</span>
      </div>

      <div class="level-tabs" id="levelTabs">
        <button type="button" class="lvl-tab active" data-lvl="lvl1_eco" title="Ultra Hemat: Teks murni (~95% irit)">
          <svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
          <span>Eco</span>
        </button>
        <button type="button" class="lvl-tab" data-lvl="lvl2_smart" title="Smart Auto: Kirim gambar hanya jika ada tabel/topologi">
          <svg viewBox="0 0 24 24"><path d="M12 2v4"/><path d="m16.2 7.8 2.9-2.9"/><path d="M18 12h4"/><path d="m16.2 16.2 2.9 2.9"/><path d="M12 18v4"/><path d="m4.9 19.1 2.9-2.9"/><path d="M2 12h4"/><path d="m4.9 4.9 2.9 2.9"/></svg>
          <span>Smart</span>
        </button>
        <button type="button" class="lvl-tab" data-lvl="lvl3_pro" title="Pro: Vision terkompresi + penalaran">
          <svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Pro</span>
        </button>
        <button type="button" class="lvl-tab" data-lvl="lvl4_max" title="Max: Vision HD + Deep Thinking">
          <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Max</span>
        </button>
      </div>
      <input type="hidden" id="quotaLevel" value="lvl1_eco" />
    </section>

    <!-- Model & Multi-Slot API Key Card (With Fallback Slots & Notification Banner) -->
    <section class="card">
      <div class="row-2">
        <select id="provider" title="Provider AI">
          <option value="gemini">Gemini 3</option>
          <option value="openrouter">OpenRouter</option>
          <option value="openai">OpenAI</option>
          <option value="groq">Groq</option>
        </select>
        <select id="modelSelect" title="Model Endpoint"></select>
      </div>

      <input type="text" id="customModel" placeholder="Endpoint model kustom (opsional)..." class="compact-input" style="display:none;" />
      <input type="text" id="customEndpoint" placeholder="Custom Endpoint URL..." class="compact-input" style="display:none;" />

      <!-- Slot #1 Primary Key + Action Buttons -->
      <div class="key-row">
        <span class="slot-tag" id="slotBadge1" title="API Key Utama (Slot #1)">K1</span>
        <input type="password" id="apiKey" placeholder="API Key Utama (Slot #1)..." />
        <button type="button" id="toggleFallbackBtn" class="icon-btn" title="Buka/Tutup Slot API Key Cadangan (Fallback Saat Limit)">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button type="button" id="toggleKeyBtn" class="icon-btn" title="Lihat/Sembunyikan Semua API Key">
          <svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button type="button" id="testApiBtn" class="icon-btn accent" title="Tes Semua Slot API Key & Cek Kuota">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
      </div>

      <!-- Fallback API Key Slots (#2 & #3) -->
      <div id="fallbackSlotsContainer" class="fallback-slots">
        <div class="key-row">
          <span class="slot-tag" id="slotBadge2" title="Fallback Cadangan 1 (Otomatis dipakai saat K1 Limit)">K2</span>
          <input type="password" id="apiKey2" placeholder="API Key Cadangan #2 (Auto-Fallback)..." />
        </div>
        <div class="key-row">
          <span class="slot-tag" id="slotBadge3" title="Fallback Cadangan 2 (Otomatis dipakai saat K2 Limit)">K3</span>
          <input type="password" id="apiKey3" placeholder="API Key Cadangan #3 (Auto-Fallback)..." />
        </div>
      </div>

      <!-- API Key Test Notification / Info Box -->
      <div id="apiTestNotif" class="api-notif" style="display: none;">
        <div class="api-notif-head">
          <span id="apiNotifSummary">Status Tes API Key</span>
          <button type="button" id="apiNotifExpandBtn" class="mini-expand-btn" title="Lihat Detail Respons API">
            <span>Detail</span>
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <div id="apiNotifDetail" class="api-notif-detail" style="display: none;"></div>
      </div>
    </section>

    <!-- 6 Compact Icon Feature Tiles -->
    <section class="card">
      <div class="tile-grid">
        <label class="tile" title="Otomatis pilih opsi jawaban">
          <input type="checkbox" id="autoSelect" />
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
          <span>Pilih</span>
        </label>

        <label class="tile" title="Otomatis klik tombol Submit">
          <input type="checkbox" id="autoSubmit" />
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          <span>Submit</span>
        </label>

        <label class="tile" title="Otomatis klik Next setelah Submit">
          <input type="checkbox" id="autoNext" />
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          <span>Next</span>
        </label>

        <label class="tile" title="Simpan jawaban di Cache Lokal (0 Kuota)">
          <input type="checkbox" id="useLocalCache" />
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          <span>Cache</span>
        </label>

        <label class="tile" title="Buka otomatis panel penjelasan AI di HUD">
          <input type="checkbox" id="showExplanation" />
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Alasan</span>
        </label>

        <label class="tile" title="Sembunyikan HUD di layar (Alt+H)">
          <input type="checkbox" id="stealthMode" />
          <svg viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
          <span>Stealth</span>
        </label>
      </div>

      <div class="delay-row">
        <span class="delay-label">Jeda <b id="delayLabel">750</b>ms</span>
        <input type="range" id="actionDelayMs" min="200" max="3000" step="50" value="750" />
        <button type="button" id="clearCacheBtn" class="mini-text-btn" title="Hapus Memori Cache Soal">Reset Cache</button>
        <label class="reload-chip" title="Hard Reload halaman setelah Submit">
          <input type="checkbox" id="reloadAfterSubmit" />
          <span>Reload</span>
        </label>
      </div>
      <input type="hidden" id="courseContext" value="Cisco CCNA / NetAcad" />
    </section>

    <!-- Last Explanation / Answer Card with Expand Button -->
    <section class="card" id="lastResultCard" style="display: none;">
      <div class="section-head">
        <span class="section-label" id="lastResultTitle">Jawaban Terakhir</span>
        <button type="button" id="expandExplanationBtn" class="mini-expand-btn" title="Expand / Sembunyikan Penjelasan Detail">
          <span>Expand</span>
          <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
      <div id="lastResultSummary" class="last-summary"></div>
      <div id="lastResultExplanation" class="last-explanation" style="display: none;"></div>
    </section>

    <footer class="footer">
      <span>Alt+S Jawab · Alt+A Auto · Alt+H Stealth</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
